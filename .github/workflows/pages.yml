# ═══════════════════════════════════════════════════════════════
#  WeatherWorld — Deploy Dashboard to GitHub Pages
#  Publishes index.html as a live website whenever
#  new data is pushed to the repo.
# ═══════════════════════════════════════════════════════════════

name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [main]       # runs every time new data is committed
  workflow_dispatch:        # manual trigger button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .           # uploads everything in the root (index.html + weather_data/)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
